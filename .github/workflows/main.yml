name: Build Wildlands 3D APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and prepare Android project
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "Wildlands3D_Android_Project.zip" ]]; then
            echo "Found Wildlands3D_Android_Project.zip"
            unzip -q -o "Wildlands3D_Android_Project.zip"
            PROJECT_DIR="$GITHUB_WORKSPACE/Wildlands3D_Android_Project"
          elif [[ -f "settings.gradle" && -f "app/build.gradle" ]]; then
            echo "Android project is at repository root"
            PROJECT_DIR="$GITHUB_WORKSPACE"
          elif [[ -f "Wildlands3D_Android_Project/settings.gradle" && -f "Wildlands3D_Android_Project/app/build.gradle" ]]; then
            echo "Found extracted Android project folder"
            PROJECT_DIR="$GITHUB_WORKSPACE/Wildlands3D_Android_Project"
          else
            echo "ERROR: Cannot find the Android project."
            echo "Upload Wildlands3D_Android_Project.zip to the repository root, or upload the extracted project files."
            echo "Files currently in the repository root:"
            ls -la
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/settings.gradle" || ! -f "$PROJECT_DIR/app/build.gradle" ]]; then
            echo "ERROR: Android project files are incomplete in: $PROJECT_DIR"
            ls -la "$PROJECT_DIR" || true
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wildlands3D-APK
          path: |
            Wildlands3D_Android_Project/app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
