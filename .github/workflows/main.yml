
name: Build Wildlands 3D APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract game project
        run: unzip -q Wildlands3D_Android_Project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - name: Accept Android SDK licenses
  run: yes | sdkmanager --licenses
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon -p Wildlands3D_Android_Project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Wildlands3D-APK
          path: Wildlands3D_Android_Project/app/build/outputs/apk/debug/app-debug.apk
