
name: Build Wildlands 3D APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project ZIP
        run: |
          ls -la
          test -f Wildlands3D_Android_Project.zip

      - name: Extract game project
        run: unzip -q Wildlands3D_Android_Project.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon -p Wildlands3D_Android_Project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wildlands3D-APK
          path: Wildlands3D_Android_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
